name: NEXORA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexora_test
      SECRET_KEY: test-only-secret-key-for-github-actions-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend-python/requirements.txt
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r frontend-python/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests frontend-python
      - name: Validate Alembic migrations on a clean PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run PostgreSQL-backed API tests
        working-directory: backend
        run: python -m pytest -q
