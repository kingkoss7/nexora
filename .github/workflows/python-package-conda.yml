name: NEXORA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexora_test
      SECRET_KEY: test-only-secret-key-for-github-actions-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend-python/requirements.txt
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r frontend-python/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests frontend-python
      - name: Validate Alembic migrations on a clean PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Smoke test NiceGUI storefront startup
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nexora-api.log 2>&1 &)
          NEXORA_API_URL=http://127.0.0.1:8000 PORT=3000 nohup python frontend-python/main.py > /tmp/nexora-ui.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:3000/", timeout=2) as response:
                      if response.status == 200:
                          print("NiceGUI storefront returned HTTP 200.")
                          break
              except (urllib.error.URLError, TimeoutError, OSError):
                  time.sleep(1)
          else:
              for path in ("/tmp/nexora-api.log", "/tmp/nexora-ui.log"):
                  print(f"--- {path} ---")
                  try:
                      print(open(path, encoding="utf-8").read())
                  except OSError:
                      pass
              raise SystemExit("NiceGUI storefront did not start successfully.")
          PY
      - name: Run PostgreSQL-backed API tests
        working-directory: backend
        run: python -m pytest -q
